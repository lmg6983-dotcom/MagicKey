<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>MagicKey</title>
  <link rel="stylesheet" href="magic.css" />
</head>
<body>
  <div id="magic" class="magic">
    <div class="magic-grip" data-drag title="끌어서 옮기기"><span></span></div>
    <div class="magic-top">
      <span class="magic-icon" aria-hidden="true" data-drag>✦</span>
      <textarea id="magic-input" class="magic-input" rows="1" placeholder="앱, 파일 찾기, 계산, 웹 검색" spellcheck="false"
        role="combobox" aria-expanded="true" aria-label="매직키 입력 (Shift+Enter 줄 바꿈)" aria-controls="magic-results" aria-autocomplete="list" autofocus></textarea>
      <button id="magic-clear" class="magic-clear" type="button" title="지우기 (Esc)" aria-label="입력 지우기" hidden>✕</button>
    </div>
    <ul id="magic-results" class="magic-results" role="listbox" aria-label="결과"></ul>
    <div class="magic-foot">
      <div id="magic-modules" class="magic-modules" role="group" aria-label="매직키 기능 (눌러서 켜고 끄기)"></div>
      <div id="magic-hint" class="magic-hint" aria-live="polite"></div>
    </div>
  </div>
  <script src="magic.js"></script>
</body>
</html>
