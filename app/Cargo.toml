[package]
name = "magickey"
description = "MagicKey — 어디서든 Ctrl+Alt+Space 로 여는 만능 입력창"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magickey-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# OPMS 저절로 찾기 — MagicSystem 과 같은 코어 (찾기 규칙 · SQL · 서버와 주고받기 · 설정)
magicsystem-core = { git = "https://github.com/lmg6983-dotcom/MagicSystem", rev = "692d6c528ea206c4e2f054c290246228f7f7dc37", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# 여는 단축키를 저수준 키보드 훅으로 (keyhook.rs) — 전역 단축키 플러그인이 이미 쓰는 판
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
