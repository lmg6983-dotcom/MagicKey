[package]
name = "magickey"
description = "MagicKey — 어디서든 Ctrl+Alt+Space 로 여는 만능 입력창"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magickey-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# OPMS 저절로 찾기 — MagicOPMS 와 같은 코어 (찾기 규칙 · SQL · 서버와 주고받기 · 설정)
magicopms-core = { git = "https://github.com/lmg6983-dotcom/MagicOPMS", rev = "1d3be03dc0eb19ae52fd50120fc1c1d5ddbb3219", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
