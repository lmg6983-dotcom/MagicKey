[package]
name = "magickey"
description = "MagicKey — 어디서든 Ctrl+Alt+Space 로 여는 만능 입력창"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magickey-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# OPMS 저절로 찾기 — MagicSystem 과 같은 코어 (찾기 규칙 · SQL · 서버와 주고받기 · 설정)
magicsystem-core = { git = "https://github.com/lmg6983-dotcom/MagicSystem", rev = "692d6c528ea206c4e2f054c290246228f7f7dc37", features = ["client"] }
# "일정 추가" 줄 미리보기 — 메모킹 일정 탭 빠른 추가와 같은 글 읽기 (schedule_parse · JS 와 parity)
memoking-core = { git = "https://github.com/lmg6983-dotcom/MemoKing", rev = "757dbead52eac955bec4e8a3e35c8b282a8791aa" }
# 파일 · 폴더 복사 (파일 그대로 클립보드에 — 탐색기에서 붙여 넣기, 메모킹 files.rs copy_files 와 같게). 클립보드 플러그인이 이미 쓰는 판
arboard = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 앱 · 파일 아이콘을 PNG 로 (shellicon.rs) — tauri 가 이미 쓰는 판
png = "0.18"

# 여는 단축키를 저수준 키보드 훅으로 (keyhook.rs), 창을 앞으로 올리기 (front.rs) — 전역 단축키 플러그인이 이미 쓰는 판
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
# 숨은 창의 WebView2 메모리 낮추기 · 그리기 멈추기 (webview.rs) — wry 가 쓰는 판 그대로
webview2-com = "0.39"
windows-core = "0.62"
# 찾은 파일 · 폴더를 탐색기로 끌어 놓기 (셸 SHDoDragDrop · drag.rs) — webview2-com 이 쓰는 판 그대로
# 앱 · 파일의 실제 아이콘 (IShellItemImageFactory · shellicon.rs) 에 Gdi 도
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
