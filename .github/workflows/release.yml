name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 태그를 올릴 수 없을 때: 여기서 태그와 릴리스를 함께 만든다
    inputs:
      tag:
        description: "릴리스 태그 (예: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p magickey-core
      - name: Build installer
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MagicKey ${{ inputs.tag || github.ref_name }}
          body_path: docs/releases/${{ inputs.tag || github.ref_name }}.md
          files: target/release/bundle/nsis/*.exe
