name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true # 토큰을 넣은 git 으로 의존성을 받게

jobs:
  test:
    name: Test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # magicsystem-core 는 비공개 MagicSystem 리포에 있다 — 읽기 토큰으로 받는다 (Settings › Secrets › Actions 의 MAGICSYSTEM_TOKEN)
      - name: Allow private MagicSystem
        shell: bash
        env:
          MAGICSYSTEM_TOKEN: ${{ secrets.MAGICSYSTEM_TOKEN }}
        run: |
          if [ -z "$MAGICSYSTEM_TOKEN" ]; then echo "::error::MAGICSYSTEM_TOKEN 이 없어 magicsystem-core 를 받을 수 없어요. MagicSystem 을 읽을 수 있는 토큰을 저장소 Settings › Secrets › Actions 에 넣어 주세요"; exit 1; fi
          git config --global url."https://x-access-token:${MAGICSYSTEM_TOKEN}@github.com/lmg6983-dotcom/MagicSystem".insteadOf "https://github.com/lmg6983-dotcom/MagicSystem"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p magickey-core
      - run: cargo clippy -p magickey-core --all-targets -- -D warnings

  build:
    name: Build (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # magicsystem-core 는 비공개 MagicSystem 리포에 있다 — 읽기 토큰으로 받는다 (Settings › Secrets › Actions 의 MAGICSYSTEM_TOKEN)
      - name: Allow private MagicSystem
        shell: bash
        env:
          MAGICSYSTEM_TOKEN: ${{ secrets.MAGICSYSTEM_TOKEN }}
        run: |
          if [ -z "$MAGICSYSTEM_TOKEN" ]; then echo "::error::MAGICSYSTEM_TOKEN 이 없어 magicsystem-core 를 받을 수 없어요. MagicSystem 을 읽을 수 있는 토큰을 저장소 Settings › Secrets › Actions 에 넣어 주세요"; exit 1; fi
          git config --global url."https://x-access-token:${MAGICSYSTEM_TOKEN}@github.com/lmg6983-dotcom/MagicSystem".insteadOf "https://github.com/lmg6983-dotcom/MagicSystem"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build installer
        working-directory: app
        # 업데이트 서명은 릴리스에서만 (PR 에는 서명 키가 없다)
        run: npx --yes @tauri-apps/cli@2 build --config tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: MagicKey-setup
          path: target/release/bundle/nsis/*.exe
